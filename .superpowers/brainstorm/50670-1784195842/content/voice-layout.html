<h2>语音功能布局</h2>
<p class="subtitle">🎤 语音转文字和 🔊 TTS 朗读是这个应用的核心功能。你希望怎么放？</p>

<div class="options">
  <div class="option" data-choice="voice-a" onclick="toggleSelect(this)">
    <div class="letter">A</div>
    <div class="content">
      <h3>保持当前位置（输入框旁）</h3>
      <p>🎤 和 🔊 在输入框左侧，与发送按钮同一排。改动最小，已经熟悉。</p>
      <div style="margin-top:8px;display:flex;gap:6px;align-items:center">
        <div style="width:32px;height:32px;border:1px solid rgba(124,58,237,0.4);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px">🎤</div>
        <div style="width:32px;height:32px;border:1px solid rgba(245,158,11,0.4);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px">🔊</div>
        <div style="flex:1;height:32px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:8px"></div>
        <div style="width:40px;height:32px;background:rgba(124,58,237,0.15);border:1px solid rgba(124,58,237,0.3);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px">→</div>
      </div>
    </div>
  </div>
  <div class="option" data-choice="voice-b" onclick="toggleSelect(this)">
    <div class="letter">B</div>
    <div class="content">
      <h3>状态栏常驻指示器</h3>
      <p>右侧加一条 40px 宽的状态条，竖排显示 🔊 TTS 状态、🎤 麦克风电平、录音时长。按钮留在输入框。</p>
      <div style="display:flex;gap:10px;margin-top:8px">
        <div style="flex:1">
          <div style="font-size:10px;color:#888;margin-bottom:4px">输入区(不变)</div>
          <div style="display:flex;gap:4px">
            <div style="width:24px;height:24px;border:1px solid rgba(124,58,237,0.4);border-radius:50%"></div>
            <div style="width:24px;height:24px;border:1px solid rgba(245,158,11,0.4);border-radius:50%"></div>
            <div style="flex:1;height:24px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:4px"></div>
          </div>
        </div>
        <div style="width:36px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.06);border-radius:4px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px">
          <div style="width:8px;height:8px;background:#22c55e;border-radius:50%"></div>
          <div style="font-size:8px;color:#888">TTS</div>
          <div style="width:70%;height:2px;background:rgba(124,58,237,0.3);border-radius:1px"></div>
          <div style="font-size:8px;color:#888">ASR</div>
          <div style="width:50%;height:2px;background:rgba(124,58,237,0.5);border-radius:1px"></div>
        </div>
      </div>
    </div>
  </div>
</div>
