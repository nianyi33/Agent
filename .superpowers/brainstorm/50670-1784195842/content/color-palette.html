<h2>深紫星空 — 配色方案细化</h2>
<p class="subtitle">在 B 方案基调下，选一套具体的配色</p>

<div class="options">
  <div class="option" data-choice="b1" onclick="toggleSelect(this)">
    <div class="letter">B1</div>
    <div class="content">
      <h3>蓝紫 + 金色</h3>
      <div style="display:flex;gap:8px;margin:8px 0">
        <div style="width:32px;height:32px;border-radius:4px;background:linear-gradient(135deg,#0a0a14,#1a1a3e)"></div>
        <div style="width:32px;height:32px;border-radius:4px;background:#7c3aed"></div>
        <div style="width:32px;height:32px;border-radius:4px;background:#a78bfa"></div>
        <div style="width:32px;height:32px;border-radius:4px;background:#f59e0b"></div>
        <div style="width:32px;height:32px;border-radius:4px;background:#e0e0e0"></div>
      </div>
      <p>主色紫罗兰 (#7c3aed)，高亮金色 (#f59e0b)。高端科技感，适合产品级应用。</p>
    </div>
  </div>

  <div class="option" data-choice="b2" onclick="toggleSelect(this)">
    <div class="letter">B2</div>
    <div class="content">
      <h3>蓝紫 + 冰蓝</h3>
      <div style="display:flex;gap:8px;margin:8px 0">
        <div style="width:32px;height:32px;border-radius:4px;background:linear-gradient(135deg,#0a0a14,#141428)"></div>
        <div style="width:32px;height:32px;border-radius:4px;background:#6366f1"></div>
        <div style="width:32px;height:32px;border-radius:4px;background:#818cf8"></div>
        <div style="width:32px;height:32px;border-radius:4px;background:#38bdf8"></div>
        <div style="width:32px;height:32px;border-radius:4px;background:#f0f0f0"></div>
      </div>
      <p>主色靛蓝 (#6366f1)，高亮天蓝 (#38bdf8)。冷静专业感，适合工具型应用。</p>
    </div>
  </div>

  <div class="option" data-choice="b3" onclick="toggleSelect(this)">
    <div class="letter">B3</div>
    <div class="content">
      <h3>深紫 + 荧光青</h3>
      <div style="display:flex;gap:8px;margin:8px 0">
        <div style="width:32px;height:32px;border-radius:4px;background:linear-gradient(135deg,#0a0a14,#1a1430)"></div>
        <div style="width:32px;height:32px;border-radius:4px;background:#8b5cf6"></div>
        <div style="width:32px;height:32px;border-radius:4px;background:#c084fc"></div>
        <div style="width:32px;height:32px;border-radius:4px;background:#2dd4bf"></div>
        <div style="width:32px;height:32px;border-radius:4px;background:#e2e8f0"></div>
      </div>
      <p>主色紫藤 (#8b5cf6)，高亮青绿 (#2dd4bf)。紫绿对比强烈，科幻感最浓。适合 AI 产品。</p>
    </div>
  </div>
</div>
