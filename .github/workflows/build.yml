name: Build

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  # ── Windows NSIS ──
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Copy bundled node.exe (if missing from LFS)
        shell: pwsh
        working-directory: desktop
        run: |
          if (-not (Test-Path resources/node.exe)) {
            Write-Host "Downloading Node.js v24.14.0 win-x64..."
            Invoke-WebRequest -Uri "https://nodejs.org/dist/v24.14.0/node-v24.14.0-win-x64.zip" -OutFile node.zip
            Expand-Archive node.zip -DestinationPath node-tmp
            Copy-Item node-tmp/node-v24.14.0-win-x64/node.exe resources/node.exe
          }
          Write-Host "node.exe: $(if (Test-Path resources/node.exe) { 'present' } else { 'MISSING' })"

      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      - name: Install backend deps (platform-native)
        shell: pwsh
        working-directory: .
        run: npm ci --omit=dev --ignore-scripts

      - name: Build Tauri (NSIS)
        working-directory: desktop
        run: npm run tauri build

      - name: Upload NSIS artifact
        uses: actions/upload-artifact@v4
        with:
          name: 闪电树懒-Windows-x64-NSIS
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

  # ── macOS DMG ──
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup macOS Node binary
        shell: bash
        working-directory: desktop
        run: |
          NODE_VERSION="24.14.0"
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            NODE_ARCH="darwin-arm64"
          else
            NODE_ARCH="darwin-x64"
          fi
          TARBALL="node-v${NODE_VERSION}-${NODE_ARCH}.tar.gz"
          curl -fsSL "https://nodejs.org/dist/v${NODE_VERSION}/${TARBALL}" -o node.tar.gz
          tar -xzf node.tar.gz
          mkdir -p resources
          cp "node-v${NODE_VERSION}-${NODE_ARCH}/bin/node" resources/node.exe
          chmod +x resources/node.exe
          echo "macOS node binary: $(ls -lh resources/node.exe)"

      - name: Install frontend deps
        working-directory: desktop
        run: npm ci

      - name: Install backend deps (platform-native)
        working-directory: .
        run: npm ci --omit=dev

      - name: Switch bundle target to DMG (macOS)
        shell: bash
        run: |
          python3 -c "
          import json
          path = 'desktop/src-tauri/tauri.conf.json'
          cfg = json.load(open(path))
          cfg['bundle']['targets'] = ['dmg']
          json.dump(cfg, open(path, 'w'), indent=2, ensure_ascii=False)
          print('targets:', cfg['bundle']['targets'])
          "

      - name: Build Tauri (DMG)
        shell: bash
        working-directory: desktop
        run: npm run tauri build

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: 闪电树懒-macOS-DMG
          path: desktop/src-tauri/target/release/bundle/dmg/*.dmg

  # ── Create GitHub Release ──
  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifact dirs
        shell: bash
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" \) -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "闪电树懒 v0.1.0"
          tag_name: "v0.1.0"
          body: |
            ## 闪电树懒 v0.1.0

            智能桌面助手 — Tauri 桌面应用，内置 Node.js 运行时 + 35 个 Agent 技能。

            ### 下载
            - **Windows**: 下载 `闪电树懒_*_x64-setup.exe`，双击安装（无需管理员权限）
            - **macOS**: 下载 `.dmg`，拖入 Applications

            ### 使用
            1. 安装后启动应用
            2. 前往 https://xinyuntoken.com/ 注册 API Key
            3. 设置页 → 通用 → 输入 Key → 激活
            4. 开始使用

            ### 特性
            - 本地优先，数据存储在 `%APPDATA%` / `~/Library/Application Support`
            - 35 个 Agent 技能自动匹配（创作/开发/产品/安全/销售）
            - 支持 DeepSeek / GLM / Kimi / Qwen / MiniMax 等 17 个模型
            - 联网搜索 (DuckDuckGo) + 浏览器自动化 (Playwright → 系统 Edge)
            - 安全沙箱（文件读写 + 命令执行路径隔离）

            > macOS 版本为首次构建，若遇到问题请在 Issues 中反馈。
          files: release-files/*
          draft: false
          prerelease: false
